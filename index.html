  <script>
    var MAX_MEMO = 200;
    var REQUIRE_INNER = false;
    var OUT_W = 1024;
    var OUT_H = 1280;
    var THUMB_W = 200;
    var THUMB_H = 250;
    var JPEG_QUALITY = 0.8;
    var TOKEN_KEY = 'memory_token';

    var state = {
      token: '', id: '', view: 'input',
      year: 0, month: 0, filter: '', selectedDate: '',
      summary: null, entries: [], req: 0, photos: {}, comments: {}, monthCache: {}, sel: '',
      who: '', friends: { friends: [], incoming: [], outgoing: [] }
    };
    var outerUrl = null;
    var innerUrl = null;
    var autoRegion = '';
    var signupMode = false;



    // ==MAP_START==
    var PROV = { '11': '서울', '21': '부산', '22': '대구', '23': '인천', '24': '광주', '25': '대전', '26': '울산', '29': '세종',
      '31': '경기', '32': '강원', '33': '충북', '34': '충남', '35': '전북', '36': '전남', '37': '경북', '38': '경남', '39': '제주' };
    var PROV_ALIAS = { '충청북': '충북', '충청남': '충남', '전라북': '전북', '전라남': '전남', '경상북': '경북', '경상남': '경남', '강원특별자치': '강원', '전북특별자치': '전북' };
    var COUNTRY_ALIAS = { '터키': 'TUR', '튀르키예': 'TUR', '홍콩': 'CHN', '마카오': 'CHN', '타이완': 'TWN', '대만': 'TWN', '체코': 'CZE', '영국': 'GBR', '미국': 'USA' };
    var CITY_HINT = { '로스앤젤레스': '캘리포니아', '샌프란시스코': '캘리포니아', '샌디에이고': '캘리포니아', '라스베이거스': '네바다', '호놀룰루': '하와이',
      '런던': '시티오브런던', '시드니': '뉴사우스웨일스', '멜버른': '빅토리아', '브리즈번': '퀸즐랜드', '푸켓': '푸껫', '호치민': '호찌민시', '마닐라': '마닐라대도시',
      '교토시': '교토', '삿포로': '홋카이도', '나고야': '아이치', '요코하마': '가나가와', '오키나와': '오키나와', '나하': '오키나와' };

    var UNIT = {};
    var UNIT_LIST = [];

    function stemKo(s) {
      s = String(s).replace(/\s/g, '');
      var t = s.replace(/(특별자치도|특별자치시|특별시|광역시|자치구|지방|지역|시티|주|도|부|현|성|시|군|구)$/, '');
      return t.length >= 2 ? t : s;
    }

    var WC_BY_A3 = {};
    var WU_BY_STEM = {};

    // 지도 데이터(약 800KB)는 지도 탭을 처음 열 때 불러온다. 처음 화면이 훨씬 가벼워진다.
    var mapReady = false;
    var mapDataPromise = null;
    function initMapIndex() {
      KR_UNITS.forEach(function (u) {
        var o = { id: u[0], name: u[1], prov: u[2], kind: u[3] };
        UNIT[o.id] = o;
        UNIT_LIST.push(o);
      });
      WORLD_C.forEach(function (c) { WC_BY_A3[c[0]] = c; });
      WORLD_U.forEach(function (u, i) { (WU_BY_STEM[stemKo(u[1])] = WU_BY_STEM[stemKo(u[1])] || []).push({ t: 'wu', i: i, a3: u[0] }); });
      WORLD_P.forEach(function (u, i) { (WU_BY_STEM[stemKo(u[1])] = WU_BY_STEM[stemKo(u[1])] || []).push({ t: 'wp', i: i, a3: u[0] }); });
      mapReady = true;
    }
    function ensureMapData() {
      if (mapReady) return Promise.resolve();
      if (mapDataPromise) return mapDataPromise;
      mapDataPromise = new Promise(function (resolve, reject) {
        var sc = document.createElement('script');
        sc.src = 'map-data.v1.js';
        sc.onload = function () {
          try { initMapIndex(); resolve(); } catch (e) { mapDataPromise = null; reject(e); }
        };
        sc.onerror = function () {
          mapDataPromise = null;
          reject(new Error('지도 데이터를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));
        };
        document.head.appendChild(sc);
      });
      return mapDataPromise;
    }
    // 로그인 뒤 잠깐 쉴 때 미리 받아 두면 지도 탭이 바로 열린다(받아 둔 파일은 기기에 저장된다).
    function prefetchMapData() {
      if (mapReady) return;
      try { fetch('map-data.v1.js', { priority: 'low' }).catch(function () {}); } catch (e) {}
    }

    function findCountry(text) {
      var s = String(text).replace(/\s/g, '');
      var low = s.toLowerCase();
      var best = '';
      var bestLen = 0;
      if (low.indexOf('unitedstates') >= 0) { best = 'USA'; bestLen = 12; }
      Object.keys(COUNTRY_ALIAS).forEach(function (k) {
        if (s.indexOf(k) >= 0 && k.length > bestLen) { best = COUNTRY_ALIAS[k]; bestLen = k.length; }
      });
      WORLD_C.forEach(function (c) {
        var ko = String(c[2]).replace(/\s/g, '');
        if (ko && s.indexOf(ko) >= 0 && ko.length > bestLen) { best = c[0]; bestLen = ko.length; }
        var en = String(c[1]).toLowerCase();
        if (en.length > 3 && low.indexOf(en) >= 0 && en.length > bestLen) { best = c[0]; bestLen = en.length; }
      });
      return best;
    }

    // 지역 이름 하나가 지도 위 어디인지 찾기
    // 결과: {kr:[한국 단위 id], world:[{t,i}], country:'ISO3', whole:true/false}
    function locate(name) {
      var res = { kr: [], world: [], country: '', whole: false };
      var s = String(name).replace(/\s/g, '');
      if (!s) return res;
      var abroad = s.indexOf(',') >= 0 || /^[A-Za-z]/.test(s);
      if (!abroad) {
        s = s.replace(/^대한민국/, '');
        if (s === '광주시') { res.kr = ['31광주시']; res.country = 'KOR'; return res; }
        var stem = stemKo(s);
        stem = PROV_ALIAS[stem] || stem;
        var provHit = false;
        Object.keys(PROV).forEach(function (c2) { if (PROV[c2] === stem) provHit = c2; });
        var isProv = !/[시군구]$/.test(s) || /(특별자치시|특별시|광역시)$/.test(s);
        if (provHit && isProv) {
          UNIT_LIST.forEach(function (u) { if (u.prov === provHit) res.kr.push(u.id); });
        } else {
          UNIT_LIST.forEach(function (u) {
            if (u.kind !== 'm' && u.name.replace(/(시|군)$/, '') === stem) res.kr.push(u.id);
          });
          if (!res.kr.length && provHit && UNIT['M' + provHit]) res.kr.push('M' + provHit);
        }
        if (res.kr.length) { res.country = 'KOR'; return res; }
      }
      var parts = String(name).split(',');
      var city = parts[0].replace(/\s/g, '');
      var a3 = findCountry(parts.length > 1 ? parts.slice(1).join(' ') : name);
      var cstem = stemKo(city);
      cstem = stemKo(CITY_HINT[city] || CITY_HINT[cstem] || cstem);
      var cands = WU_BY_STEM[cstem] || [];
      if (a3) cands = cands.filter(function (c) { return c.a3 === a3; });
      else if (cands.length) {
        var first = cands[0].a3;
        cands = cands.filter(function (c) { return c.a3 === first; });
        if (cands.length !== (WU_BY_STEM[cstem] || []).length) cands = [];
        a3 = cands.length ? first : '';
      }
      if (!a3) a3 = findCountry(name);
      if (!a3) return res;
      res.country = a3;
      if (a3 === 'KOR') { return res; }
      if (cands.length) res.world = cands; else res.whole = true;
      return res;
    }
    // ==MAP_END==

    function $(id) { return document.getElementById(id); }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function errorText(e) {
      var t = (e && e.message) ? e.message : String(e);
      return t.replace(/^Error:\s*/, '');
    }
    function sessionGone(e) { return errorText(e).indexOf('다시 로그인해 주세요') >= 0; }
    // 뒤편(Apps Script)에 요청을 보낸다. 읽기(목록, 요약)는 GET, 나머지는 POST.
    // 특별한 헤더는 붙이지 않는다(붙이면 브라우저가 사전 확인 요청을 먼저 보내 막힌다).
    var POST_FIELDS = {
      signup: ['id', 'pw'],
      login: ['id', 'pw'],
      checkSession: ['token'],
      logout: ['token'],
      lookupRegion: ['token', 'lat', 'lng'],
      getPhoto: ['token', 'name'],
      getPhotos: ['token', 'names'],
      getFriends: ['token'],
      requestFriend: ['token', 'friendId'],
      respondFriend: ['token', 'fromId', 'accept'],
      removeFriend: ['token', 'friendId'],
      getComments: ['token', 'names'],
      addComment: ['token', 'name', 'text'],
      deleteComment: ['token', 'name', 'cid']
    };

    function query(obj) {
      return Object.keys(obj).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k] === undefined || obj[k] === null ? '' : obj[k]);
      }).join('&');
    }

    function call(fn, args) {
      var req;
      if (!API_URL) {
        return Promise.reject(new Error('API_URL이 비어 있어요. index.html 맨 위의 API_URL에 웹 앱 주소를 붙여 넣어 주세요.'));
      }
      if (fn === 'listMonth' || fn === 'listBoth') {
        req = fetch(API_URL + '?' + query({ action: 'list', token: args[0], ym: args[1], region: args[2], who: args[3], summary: (fn === 'listBoth' && args[4]) ? '1' : '' }));
      } else if (fn === 'getSummary') {
        req = fetch(API_URL + '?' + query({ action: 'list', token: args[0], who: args[1] }));
      } else {
        var form;
        if (fn === 'saveEntry') {
          form = { action: 'save', token: args[0], photo: args[1].photo, thumb: args[1].thumb, region: args[1].region, memo: args[1].memo };
        } else {
          var names = POST_FIELDS[fn];
          if (!names) return Promise.reject(new Error('알 수 없는 요청이에요.'));
          form = { action: fn };
          names.forEach(function (n, i) { form[n] = args[i]; });
        }
        req = fetch(API_URL, { method: 'POST', body: JSON.stringify(form) });
      }
      return req
        .then(function (r) { return r.json(); })
        .catch(function () {
          throw new Error('서버에서 답을 받지 못했어요. 인터넷 연결과 API_URL, 배포 설정(액세스: 모든 사용자)을 확인해 주세요.');
        })
        .then(function (res) {
          if (!res || res.ok !== true) {
            throw new Error(res && res.error ? res.error : '요청을 처리하지 못했어요.');
          }
          if (fn === 'listMonth') return res.data.entries;
          if (fn === 'listBoth') return res.data;
          if (fn === 'getSummary') return res.data.summary;
          return res.data;
        });
    }
    var ID_KEY = 'memory_id';
    // 서버는 한동안 안 쓰면 잠들어 첫 요청이 느리다. 로그인 화면이 떠 있는 동안 미리 한 번 깨워 둔다.
    var warmed = false;
    function warmServer() {
      if (warmed || !API_URL) return;
      warmed = true;
      try { fetch(API_URL + '?action=ping').catch(function () {}); } catch (e) {}
    }
    function saveToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
    function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
    function saveId(i) { try { localStorage.setItem(ID_KEY, i); } catch (e) {} }
    function loadId() { try { return localStorage.getItem(ID_KEY) || ''; } catch (e) { return ''; } }
    function clearToken() { try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(ID_KEY); } catch (e) {} }
    function todayText() {
      var d = new Date();
      var days = ['일', '월', '화', '수', '목', '금', '토'];
      return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일';
    }
    function showBox(id, kind, text) {
      var m = $(id);
      m.className = 'msgBox ' + kind;
      m.textContent = text;
      m.style.display = 'block';
    }
    function hideBox(id) { $(id).style.display = 'none'; }

    /* ---------- 로그인 ---------- */
    function setMode(s) {
      signupMode = s;
      $('authBtn').textContent = s ? '가입하기' : '로그인';
      $('toggleMode').textContent = s ? '이미 아이디가 있어요' : '처음이면 가입하기';
      $('authHint').textContent = s ? '아이디는 별칭이에요. 실명이나 전화번호는 쓰지 마세요. (2~12자, 글자·숫자·_)' : '';
      hideBox('authMsg');
    }

    function setAuthBusy(busy) {
      $('authBtn').disabled = busy;
      $('authBtn').textContent = busy ? '잠시만요...' : (signupMode ? '가입하기' : '로그인');
    }

    function submitAuth() {
      hideBox('authMsg');
      var id = $('uid').value.trim();
      var pw = $('upw').value;
      if (!id) { showBox('authMsg', 'err', '아이디를 적어 주세요.'); return; }
      if (!pw) { showBox('authMsg', 'err', '비밀번호를 적어 주세요.'); return; }
      setAuthBusy(true);
      call(signupMode ? 'signup' : 'login', [id, pw])
        .then(function (res) { setAuthBusy(false); enterApp(res); })
        .catch(function (e) { setAuthBusy(false); showBox('authMsg', 'err', errorText(e)); });
    }

    function enterApp(res) {
      state.token = res.token;
      state.id = res.id;
      saveToken(res.token);
      saveId(res.id);
      setTimeout(prefetchMapData, 5000);
      $('upw').value = '';
      $('viewLogin').style.display = 'none';
      $('app').style.display = 'block';
      $('tabs').style.display = 'flex';
      $('whoId').textContent = res.id;
      $('avatar').textContent = res.id.charAt(0).toUpperCase();
      showView('input');
      detectRegion();
      // 친구 목록은 급하지 않다. 바로 부르면 추억 탭의 첫 요청이 그 뒤에 줄을 서게 된다.
      setTimeout(fetchFriends, 2500);
    }

    function toLogin(msg) {
      clearToken();
      Object.keys(state.photos).forEach(function (k) { try { URL.revokeObjectURL(state.photos[k]); } catch (e) {} });
      state.token = ''; state.id = ''; state.summary = null; state.photos = {}; state.comments = {}; state.monthCache = {};
      state.entries = []; state.filter = ''; state.selectedDate = ''; state.year = 0;
      state.who = ''; state.friends = { friends: [], incoming: [], outgoing: [] };
      autoRegion = '';
      clearOuter(); clearInner();
      $('region').value = '';
      $('memo').value = '';
      $('menu').style.display = 'none';
      $('app').style.display = 'none';
      $('tabs').style.display = 'none';
      $('viewLogin').style.display = 'block';
      setMode(false);
      if (msg) showBox('authMsg', 'err', msg);
    }

    function handleFail(e, fallback) {
      if (sessionGone(e)) { toLogin('로그인이 끝났어요. 다시 로그인해 주세요.'); return; }
      fallback(errorText(e));
    }

    /* ---------- 화면 전환 ---------- */
    var TITLES = {
      input: ['오늘의 추억', ''],
      list: ['나의 추억', '날짜를 눌러 그날의 기록을 봐요'],
      summary: ['나의 발자국', '다녀온 곳이 환하게 빛나요'],
      friends: ['친구', '함께 보면 더 좋아요']
    };

    function titleFor(name) {
      var t = TITLES[name];
      if (state.who && (name === 'list' || name === 'summary')) {
        return [state.who + '님의 ' + (name === 'list' ? '추억' : '발자국'), '친구의 기록을 보고 있어요'];
      }
      return t;
    }

    function showView(name) {
      state.view = name;
      $('menu').style.display = 'none';
      ['input', 'list', 'summary', 'friends'].forEach(function (v) {
        $('view_' + v).style.display = v === name ? 'block' : 'none';
        $('tab_' + v).className = 'tab' + (v === name ? ' on' : '');
      });
      var t = titleFor(name);
      $('title').textContent = t[0];
      $('subtitle').textContent = name === 'input' ? todayText() : t[1];
      window.scrollTo(0, 0);
      renderWho();
      if (name === 'list') loadList();
      if (name === 'summary') loadSummary();
      if (name === 'friends') fetchFriends();
    }

    /* ---------- 친구 ---------- */
    function tintOf(id) {
      var h = 0;
      for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360;
      return { bg: 'hsl(' + h + ', 80%, 88%)', ink: 'hsl(' + h + ', 55%, 25%)' };
    }

    function favEl(id, cls) {
      var t = tintOf(id);
      var d = el('span', cls || 'fav', id.charAt(0).toUpperCase());
      d.style.background = t.bg;
      d.style.color = t.ink;
      return d;
    }

    function fetchFriends() {
      if (!state.token) return Promise.resolve();
      return call('getFriends', [state.token])
        .then(function (f) {
          state.friends = f;
          if (state.who && f.friends.indexOf(state.who) < 0) { state.who = ''; }
          var n = f.incoming.length;
          $('badge_friends').textContent = n ? String(n) : '';
          $('badge_friends').style.display = n ? 'block' : 'none';
          renderWho();
          if (state.view === 'friends') renderFriends();
        })
        .catch(function (e) {
          handleFail(e, function () {});
        });
    }

    function renderWho() {
      var friends = state.friends.friends || [];
      ['whoBarList', 'whoBarSum'].forEach(function (id) {
        var bar = $(id);
        bar.innerHTML = '';
        bar.style.display = friends.length ? 'flex' : 'none';
        if (!friends.length) return;
        [''].concat(friends).forEach(function (f) {
          var b = el('button', 'wchip' + (state.who === f ? ' on' : ''));
          b.type = 'button';
          b.appendChild(f ? favEl(f) : favEl(state.id || '나'));
          b.appendChild(document.createTextNode(f || '나'));
          b.addEventListener('click', function () { setWho(f); });
          bar.appendChild(b);
        });
      });
    }

    function setWho(id) {
      if (state.who === id) return;
      state.who = id;
      state.summary = null;
      state.filter = '';
      state.selectedDate = '';
      state.entries = [];
      showView(state.view === 'summary' ? 'summary' : 'list');
    }

    function friendFail(e) {
      handleFail(e, function (t) {
        if (t.indexOf('친구가 아니라서') >= 0) { state.who = ''; state.summary = null; fetchFriends(); }
        showBox('friendMsg', 'err', t);
      });
    }

    function renderFriends() {
      var f = state.friends;
      var req = $('reqList'); req.innerHTML = '';
      $('reqCard').style.display = f.incoming.length ? 'block' : 'none';
      f.incoming.forEach(function (id) {
        var row = el('div', 'frow');
        row.appendChild(favEl(id));
        row.appendChild(el('div', 'fname', id));
        var ok = el('button', 'fbtn go', '수락'); ok.type = 'button';
        var no = el('button', 'fbtn', '거절'); no.type = 'button';
        ok.addEventListener('click', function () { answer(id, true); });
        no.addEventListener('click', function () { answer(id, false); });
        row.appendChild(ok); row.appendChild(no);
        req.appendChild(row);
      });

      var list = $('friendList'); list.innerHTML = '';
      if (!f.friends.length) {
        list.appendChild(el('div', 'fempty', '아직 친구가 없어요. 위에서 친구 아이디로 요청을 보내 보세요.'));
      }
      f.friends.forEach(function (id) {
        var row = el('div', 'frow');
        row.appendChild(favEl(id));
        row.appendChild(el('div', 'fname', id));
        var see = el('button', 'fbtn go', '추억 보기'); see.type = 'button';
        see.addEventListener('click', function () { state.who = ''; setWho(id); });
        var del = el('button', 'fbtn', '끊기'); del.type = 'button';
        var armed = false;
        del.addEventListener('click', function () {
          if (!armed) {
            armed = true; del.textContent = '정말 끊기'; del.className = 'fbtn warn';
            setTimeout(function () { armed = false; del.textContent = '끊기'; del.className = 'fbtn'; }, 3000);
            return;
          }
          dropFriend(id);
        });
        row.appendChild(see); row.appendChild(del);
        list.appendChild(row);
      });

      var sent = $('sentList'); sent.innerHTML = '';
      $('sentCard').style.display = f.outgoing.length ? 'block' : 'none';
      f.outgoing.forEach(function (id) {
        var row = el('div', 'frow');
        row.appendChild(favEl(id));
        var nm = el('div', 'fname', id);
        nm.appendChild(el('small', '', '수락을 기다리는 중'));
        row.appendChild(nm);
        var c = el('button', 'fbtn', '취소'); c.type = 'button';
        c.addEventListener('click', function () { dropFriend(id); });
        row.appendChild(c);
        sent.appendChild(row);
      });
    }

    function addFriend() {
      hideBox('friendMsg');
      var id = $('friendId').value.trim();
      if (!id) { showBox('friendMsg', 'err', '친구 아이디를 적어 주세요.'); return; }
      $('friendAdd').disabled = true;
      call('requestFriend', [state.token, id])
        .then(function (r) {
          $('friendAdd').disabled = false;
          $('friendId').value = '';
          showBox('friendMsg', 'ok', r.message);
          fetchFriends();
        })
        .catch(function (e) { $('friendAdd').disabled = false; friendFail(e); });
    }

    function answer(id, accept) {
      hideBox('friendMsg');
      call('respondFriend', [state.token, id, accept])
        .then(function (r) { showBox('friendMsg', 'ok', r.message); fetchFriends(); })
        .catch(friendFail);
    }

    function dropFriend(id) {
      hideBox('friendMsg');
      call('removeFriend', [state.token, id])
        .then(function () { if (state.who === id) state.who = ''; state.summary = null; fetchFriends(); })
        .catch(friendFail);
    }

    /* ---------- 입력 ---------- */
    function setBusy(busy) {
      $('save').disabled = busy;
      $('shoot').disabled = busy;
      $('shootInner').disabled = busy;
      $('save').textContent = busy ? '저장하는 중...' : '올리기';
    }

    function updateBadge() {
      var show = autoRegion && $('region').value.trim() === autoRegion;
      $('badge').style.display = show ? 'block' : 'none';
    }

    function clearOuter() {
      $('photo').value = '';
      $('preview').style.display = 'none';
      $('stageEmpty').style.display = 'flex';
      $('shoot').textContent = '바깥 찍기';
      $('shoot').className = 'btn';
      if (outerUrl) { URL.revokeObjectURL(outerUrl); outerUrl = null; }
    }

    function clearInner() {
      $('photoInner').value = '';
      $('innerPreview').style.display = 'none';
      $('insetEmpty').style.display = 'block';
      $('inset').className = 'inset';
      $('shootInner').textContent = '안쪽 찍기';
      $('shootInner').className = 'btn';
      if (innerUrl) { URL.revokeObjectURL(innerUrl); innerUrl = null; }
    }

    function check(outer, inner, region, memo) {
      if (!outer) return '바깥 카메라로 사진을 찍어 주세요.';
      if (outer.type.indexOf('image/') !== 0) return '사진 파일만 올릴 수 있습니다.';
      if (REQUIRE_INNER && !inner) return '안쪽 카메라 사진도 찍어 주세요.';
      if (inner && inner.type.indexOf('image/') !== 0) return '사진 파일만 올릴 수 있습니다.';
      if (!region) return '지역을 적어 주세요.';
      if (memo.length > MAX_MEMO) return '멘트는 ' + MAX_MEMO + '자 이내로 적어 주세요.';
      return '';
    }

    function loadImage(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error('이 사진을 읽을 수 없습니다. jpg나 png 사진으로 다시 시도해 주세요.'));
        };
        img.src = url;
      });
    }

    function drawCover(ctx, img, dx, dy, dw, dh) {
      var scale = Math.max(dw / img.width, dh / img.height);
      var sw = dw / scale;
      var sh = dh / scale;
      ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, dx, dy, dw, dh);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function composePhoto(outerFile, innerFile) {
      var jobs = [loadImage(outerFile)];
      if (innerFile) jobs.push(loadImage(innerFile));
      return Promise.all(jobs).then(function (imgs) {
        var canvas = document.createElement('canvas');
        canvas.width = OUT_W;
        canvas.height = OUT_H;
        var ctx = canvas.getContext('2d');
        drawCover(ctx, imgs[0], 0, 0, OUT_W, OUT_H);
        if (imgs[1]) {
          var fw = Math.round(OUT_W * 0.3);
          var fh = Math.round(fw * 4 / 3);
          var fx = Math.round(OUT_W * 0.03125);
          var fy = Math.round(OUT_H * 0.025);
          var b = 8;
          ctx.fillStyle = '#ffffff';
          roundRect(ctx, fx, fy, fw, fh, 28);
          ctx.fill();
          ctx.save();
          roundRect(ctx, fx + b, fy + b, fw - 2 * b, fh - 2 * b, 20);
          ctx.clip();
          drawCover(ctx, imgs[1], fx + b, fy + b, fw - 2 * b, fh - 2 * b);
          ctx.restore();
        }
        var tc = document.createElement('canvas');
        tc.width = THUMB_W;
        tc.height = THUMB_H;
        tc.getContext('2d').drawImage(canvas, 0, 0, THUMB_W, THUMB_H);
        return {
          photo: canvas.toDataURL('image/jpeg', JPEG_QUALITY).split(',')[1],
          thumb: tc.toDataURL('image/jpeg', 0.7).split(',')[1]
        };
      });
    }

    function detectRegion() {
      if (!navigator.geolocation) {
        $('hint').textContent = '이 기기에서는 위치를 쓸 수 없어요. 지역을 직접 적어 주세요.';
        return;
      }
      $('hint').textContent = '위치로 지역을 찾는 중...';
      var token = state.token;
      navigator.geolocation.getCurrentPosition(function (pos) {
        call('lookupRegion', [token, pos.coords.latitude, pos.coords.longitude])
          .then(function (name) {
            if (name) {
              if (!$('region').value.trim()) {
                $('region').value = name;
                autoRegion = name;
              }
              $('hint').textContent = '';
              updateBadge();
            } else {
              $('hint').textContent = '위치로 지역을 찾지 못했어요. 직접 적어 주세요.';
            }
          })
          .catch(function () {
            $('hint').textContent = '위치로 지역을 찾지 못했어요. 직접 적어 주세요.';
          });
      }, function () {
        $('hint').textContent = '위치를 가져오지 못했어요. 지역을 직접 적어 주세요.';
      }, { timeout: 10000 });
    }

    function openOuter() { $('photo').click(); }
    function openInner() { $('photoInner').click(); }
    function onKey(fn) {
      return function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); fn(); }
      };
    }

    function saveEntryClick() {
      hideBox('msg');
      var outer = $('photo').files[0];
      var inner = $('photoInner').files[0];
      var region = $('region').value.trim();
      var memo = $('memo').value.trim();

      var err = check(outer, inner, region, memo);
      if (err) { showBox('msg', 'err', err); return; }

      setBusy(true);
      composePhoto(outer, inner)
        .then(function (r) {
          return call('saveEntry', [state.token, { photo: r.photo, thumb: r.thumb, region: region, memo: memo }]);
        })
        .then(function (res) {
          setBusy(false);
          showBox('msg', 'ok', res.message);
          clearOuter();
          clearInner();
          $('memo').value = '';
          $('cnt').textContent = '0';
          state.summary = null;
          state.monthCache = {};
        })
        .catch(function (e) {
          setBusy(false);
          handleFail(e, function (t) { showBox('msg', 'err', '저장하지 못했습니다. ' + t); });
        });
    }

    /* ---------- 목록 ---------- */
    function findRegion(name) {
      var list = (state.summary && state.summary.regions) || [];
      for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
      return null;
    }

    function ensureSummary() {
      if (state.summary) return Promise.resolve();
      return call('getSummary', [state.token, state.who]).then(function (s) { state.summary = s; });
    }

    function fillFilter() {
      var sel = $('filter');
      sel.innerHTML = '';
      var all = document.createElement('option');
      all.value = '';
      all.textContent = '전체 지역';
      sel.appendChild(all);
      ((state.summary && state.summary.regions) || []).forEach(function (r) {
        var op = document.createElement('option');
        op.value = r.name;
        op.textContent = r.name + ' (' + r.count + ')';
        sel.appendChild(op);
      });
      sel.value = state.filter;
      state.filter = sel.value;
    }

    function loadList() {
      if (!state.year) {
        var d = new Date();
        state.year = d.getFullYear();
        state.month = d.getMonth() + 1;
      }
      loadMonth();
    }

    function entriesSig(list) {
      return (list || []).map(function (e) { return [e.photo, e.region, e.memo, e.time].join('~'); }).join('|');
    }

    // 목록과 요약을 서버에 한 번만 묻는다. 이전에 본 달은 바로 보여 주고 뒤에서 새로 확인한다.
    function loadMonth() {
      $('monthTitle').textContent = state.year + '년 ' + state.month + '월';
      var mine = ++state.req;
      var ym = state.year + '-' + pad2(state.month);
      var key = [state.who, state.filter, ym].join('|');
      var cached = state.monthCache[key];
      if (cached) {
        state.entries = cached;
        renderCal();
        renderDetail();
        prefetchLatestDay(cached);
      } else {
        $('calStatus').textContent = '불러오는 중...';
      }
      call('listBoth', [state.token, ym, state.filter, state.who, !state.summary])
        .then(function (res) {
          if (mine !== state.req) return;
          if (res.summary) {
            var before = state.filter;
            state.summary = res.summary;
            fillFilter();
            if (state.filter !== before) { loadMonth(); return; }
          }
          state.monthCache[key] = res.entries;
          if (cached && entriesSig(cached) === entriesSig(res.entries)) return;
          state.entries = res.entries;
          renderCal();
          renderDetail();
          prefetchLatestDay(res.entries);
        })
        .catch(function (e) {
          if (mine !== state.req) return;
          if (cached && !sessionGone(e)) return;
          handleFail(e, function (t) { $('calStatus').textContent = '불러오지 못했어요. ' + t; });
        });
    }

    function renderCal() {
      var y = state.year, m = state.month;
      var first = new Date(y, m - 1, 1).getDay();
      var days = new Date(y, m, 0).getDate();
      var byDate = {};
      state.entries.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
      var cal = $('cal');
      cal.innerHTML = '';
      for (var i = 0; i < first; i++) cal.appendChild(el('div', 'day blank'));
      var t = new Date();
      var todayStr = t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
      for (var d = 1; d <= days; d++) {
        var ds = y + '-' + pad2(m) + '-' + pad2(d);
        var list = byDate[ds];
        var b = el('button', 'day');
        b.type = 'button';
        b.appendChild(el('span', 'n', String(d)));
        if (list) {
          b.className += ' has';
          if (list[0].thumb) {
            b.style.backgroundImage = 'url("data:image/jpeg;base64,' + list[0].thumb + '")';
          } else {
            b.className += ' nothumb';
          }
          if (list.length > 1) b.appendChild(el('span', 'c', String(list.length)));
          b.setAttribute('aria-label', m + '월 ' + d + '일 기록 ' + list.length + '개');
          (function (date) {
            b.addEventListener('click', function () {
              state.selectedDate = date;
              renderCal();
              renderDetail();
            });
          })(ds);
        } else {
          b.disabled = true;
        }
        if (ds === todayStr) b.className += ' today';
        if (ds === state.selectedDate) b.className += ' sel';
        cal.appendChild(b);
      }
      $('calStatus').textContent = state.entries.length
        ? ''
        : (state.filter ? state.filter + ' 기록이 이 달에는 없어요.' : '이 달에는 기록이 없어요.');
    }

    /* ---------- 사진 보관함: 한 번 본 사진은 이 기기에 저장해서 다음부터 바로 보여 준다 ---------- */
    var PHOTO_KEEP = 300;
    var PHOTO_CHUNK = 3;
    var photoDb = null;
    var pendingPhotos = {};
    var photoWait = [];
    var photoTimer = null;
    var photoChain = Promise.resolve();

    function openPhotoDb() {
      if (photoDb) return photoDb;
      photoDb = new Promise(function (resolve) {
        try {
          var rq = indexedDB.open('memory_photos', 1);
          rq.onupgradeneeded = function () {
            var st = rq.result.createObjectStore('p');
            st.createIndex('t', 't');
          };
          rq.onsuccess = function () { resolve(rq.result); };
          rq.onerror = function () { resolve(null); };
          rq.onblocked = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
      return photoDb;
    }

    function dbGet(name) {
      return openPhotoDb().then(function (db) {
        if (!db) return null;
        return new Promise(function (resolve) {
          try {
            var rq = db.transaction('p').objectStore('p').get(name);
            rq.onsuccess = function () { resolve(rq.result && rq.result.blob ? rq.result.blob : null); };
            rq.onerror = function () { resolve(null); };
          } catch (e) { resolve(null); }
        });
      });
    }

    function dbPut(name, blob) {
      return openPhotoDb().then(function (db) {
        if (!db) return;
        try {
          var st = db.transaction('p', 'readwrite').objectStore('p');
          st.put({ blob: blob, t: Date.now() }, name);
          var cr = st.count();
          cr.onsuccess = function () {
            var extra = cr.result - PHOTO_KEEP;
            if (extra <= 0) return;
            var cur = st.index('t').openCursor();
            cur.onsuccess = function () {
              var c = cur.result;
              if (!c || extra <= 0) return;
              c.delete();
              extra--;
              c.continue();
            };
          };
        } catch (e) {}
      });
    }

    function dbClear() {
      return openPhotoDb().then(function (db) {
        if (!db) return;
        try { db.transaction('p', 'readwrite').objectStore('p').clear(); } catch (e) {}
      });
    }

    // 서버는 요청 한 번에 1~2초가 들고, 여러 개를 동시에 보내도 줄을 서서 처리한다.
    // 그래서 사진은 장마다 따로 부르지 않고, 잠깐 모았다가 3장씩 한 번에 받는다.
    function requestPhoto(name) {
      if (pendingPhotos[name]) return pendingPhotos[name];
      var d = { name: name, token: state.token };
      d.p = new Promise(function (resolve, reject) { d.resolve = resolve; d.reject = reject; });
      d.p.catch(function () {});
      pendingPhotos[name] = d.p;
      photoWait.push(d);
      if (!photoTimer) photoTimer = setTimeout(flushPhotos, 80);
      return d.p;
    }

    function settlePhoto(d, blob, err) {
      if (pendingPhotos[d.name] === d.p) delete pendingPhotos[d.name];
      if (blob) d.resolve(blob); else d.reject(err || new Error('사진을 찾을 수 없어요.'));
    }

    function flushPhotos() {
      photoTimer = null;
      var todo = photoWait;
      photoWait = [];
      for (var i = 0; i < todo.length; i += PHOTO_CHUNK) {
        (function (chunk) {
          photoChain = photoChain.then(function () {
            if (chunk[0].token !== state.token) {
              chunk.forEach(function (d) { settlePhoto(d, null, new Error('skip')); });
              return null;
            }
            return call('getPhotos', [chunk[0].token, chunk.map(function (d) { return d.name; })])
              .then(function (map) {
                return Promise.all(chunk.map(function (d) {
                  var url = map && map[d.name];
                  if (!url) { settlePhoto(d, null); return null; }
                  return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
                    if (d.token !== state.token) { settlePhoto(d, null, new Error('skip')); return; }
                    dbPut(d.name, b);
                    if (!state.photos[d.name]) state.photos[d.name] = URL.createObjectURL(b);
                    settlePhoto(d, b);
                  }, function (e) { settlePhoto(d, null, e); });
                }));
              })
              .catch(function (e) { chunk.forEach(function (d) { settlePhoto(d, null, e); }); });
          });
        })(todo.slice(i, i + PHOTO_CHUNK));
      }
    }

    // 달력을 보여 주고 나면 가장 최근 날의 사진을 미리 받아 둔다(그날을 누르면 바로 보인다).
    function prefetchLatestDay(list) {
      if (!list || !list.length) return;
      var latest = list.reduce(function (a, e) { return e.date > a ? e.date : a; }, '');
      var names = list.filter(function (e) { return e.date === latest; }).map(function (e) { return e.photo; });
      setTimeout(function () {
        if (state.view !== 'list') return;
        names.forEach(function (n) {
          if (state.photos[n] || pendingPhotos[n]) return;
          dbGet(n).then(function (b) { if (!b && !state.photos[n]) requestPhoto(n).catch(function () {}); });
        });
      }, 400);
    }

    function putPhoto(ph, url) {
      if (!ph.querySelector('.phThumb, .phMsg')) ph.textContent = '';
      var img = new Image();
      img.decoding = 'async';
      img.alt = '저장한 사진';
      img.className = 'full';
      img.onload = function () {
        ph.className = 'ph';
        Array.prototype.slice.call(ph.querySelectorAll('.phThumb, .phMsg')).forEach(function (n) { n.remove(); });
        img.className = 'full in';
      };
      img.onerror = function () { showPhotoError(ph, '', null, '사진을 표시하지 못했어요.', true); };
      img.src = url;
      ph.appendChild(img);
    }

    function showPhotoError(ph, name, thumb, text, noRetry) {
      ph.className = 'ph err';
      ph.textContent = '';
      ph.appendChild(el('div', '', text || '사진을 불러오지 못했어요.'));
      if (noRetry || !name) return;
      var b = el('button', 'retry', '다시 시도');
      b.type = 'button';
      b.addEventListener('click', function () { loadPhoto(name, ph, thumb); });
      ph.appendChild(b);
    }

    function loadPhoto(name, ph, thumb) {
      if (state.photos[name]) { putPhoto(ph, state.photos[name]); return; }
      ph.className = 'ph loading' + (thumb ? ' hasThumb' : '');
      ph.textContent = '';
      if (thumb) {
        var t = new Image();
        t.className = 'phThumb';
        t.alt = '';
        t.src = 'data:image/jpeg;base64,' + thumb;
        ph.appendChild(t);
      }
      ph.appendChild(el('span', 'phMsg', '사진 불러오는 중...'));
      dbGet(name)
        .then(function (blob) {
          if (blob || state.photos[name]) return blob;
          return requestPhoto(name);
        })
        .then(function (blob) {
          var url = state.photos[name] || (blob ? (state.photos[name] = URL.createObjectURL(blob)) : '');
          if (!url) throw new Error('사진을 찾을 수 없어요.');
          putPhoto(ph, url);
        })
        .catch(function (e) {
          handleFail(e, function (t2) { showPhotoError(ph, name, thumb, t2); });
        });
    }

    var PIN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';

    /* ---------- 댓글 ---------- */
    var commentBoxes = {};

    function photoOwner(name) { return String(name).replace(/_\d{8}_\d{6}\.jpg$/, ''); }

    function commentBox(name) {
      var box = el('div', 'cmts');
      box.dataset.name = name;
      commentBoxes[name] = box;
      paintComments(name);
      return box;
    }

    function paintComments(name) {
      var box = commentBoxes[name];
      if (!box) return;
      box.textContent = '';
      var list = state.comments[name];
      if (!list) box.appendChild(el('div', 'cmtNote', '댓글 불러오는 중...'));
      else list.forEach(function (c) {
        var row = el('div', 'cmt');
        var body = el('div', 'body');
        body.appendChild(el('b', '', c.by));
        body.appendChild(document.createTextNode(c.text));
        body.appendChild(el('span', 'at', c.at));
        row.appendChild(body);
        if (c.by.toLowerCase() === state.id.toLowerCase() || photoOwner(name).toLowerCase() === state.id.toLowerCase()) {
          var d = el('button', 'del', '×');
          d.type = 'button';
          d.setAttribute('aria-label', '댓글 지우기');
          d.addEventListener('click', function () {
            d.disabled = true;
            call('deleteComment', [state.token, name, c.cid]).then(function () {
              state.comments[name] = (state.comments[name] || []).filter(function (x) { return x.cid !== c.cid; });
              paintComments(name);
            }).catch(function (e) { d.disabled = false; handleFail(e, function (t) { showCmtError(box, t); }); });
          });
          row.appendChild(d);
        }
        box.appendChild(row);
      });
      var form = el('form', 'cmtForm');
      var inp = el('input');
      inp.type = 'text'; inp.maxLength = 200; inp.placeholder = '댓글 남기기'; inp.setAttribute('aria-label', '댓글');
      var btn = el('button', '', '등록');
      btn.type = 'submit';
      form.appendChild(inp); form.appendChild(btn);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var text = inp.value.trim();
        if (!text) return;
        btn.disabled = true; inp.disabled = true;
        call('addComment', [state.token, name, text]).then(function (c) {
          (state.comments[name] = state.comments[name] || []).push(c);
          paintComments(name);
        }).catch(function (e) {
          btn.disabled = false; inp.disabled = false;
          handleFail(e, function (t) { showCmtError(box, t); });
        });
      });
      box.appendChild(form);
    }

    function showCmtError(box, text) {
      var old = box.querySelector('.cmtErr');
      if (old) old.remove();
      var n = el('div', 'cmtNote cmtErr', text);
      n.style.color = '#b00020';
      box.insertBefore(n, box.querySelector('.cmtForm'));
    }

    function fetchComments(names) {
      if (!names.length) return;
      setTimeout(function () {
        call('getComments', [state.token, names.slice(0, 12)]).then(function (res) {
          names.forEach(function (n) { state.comments[n] = (res && res[n]) || []; paintComments(n); });
        }).catch(function (e) {
          names.forEach(function (n) {
            if (!state.comments[n]) { state.comments[n] = []; paintComments(n); }
          });
          handleFail(e, function () {});
        });
      }, 700);
    }

    function renderDetail() {
      var box = $('detail');
      box.innerHTML = '';
      var items = state.entries.filter(function (e) { return e.date === state.selectedDate; });
      if (!items.length) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      var p = state.selectedDate.split('-').map(Number);
      var dow = ['일', '월', '화', '수', '목', '금', '토'][new Date(p[0], p[1] - 1, p[2]).getDay()];
      box.appendChild(el('div', 'detailTitle', p[1] + '월 ' + p[2] + '일 ' + dow + '요일'));
      items.forEach(function (e) {
        var wrap = el('div', 'entry');
        var meta = el('div', 'meta');
        meta.innerHTML = PIN_SVG;
        meta.appendChild(el('span', '', e.region));
        if (e.time) meta.appendChild(el('span', 't', e.time));
        wrap.appendChild(meta);
        var ph = el('div', 'ph', '사진 불러오는 중...');
        wrap.appendChild(ph);
        if (e.memo) wrap.appendChild(el('div', 'memoText', e.memo));
        wrap.appendChild(commentBox(e.photo));
        box.appendChild(wrap);
        loadPhoto(e.photo, ph, e.thumb);
      });
      fetchComments(items.map(function (e) { return e.photo; }));
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function moveMonth(delta) {
      state.month += delta;
      if (state.month < 1) { state.month = 12; state.year--; }
      if (state.month > 12) { state.month = 1; state.year++; }
      state.selectedDate = '';
      loadMonth();
    }

    function openRegion(name, last) {
      state.filter = name;
      if (last) {
        state.year = Number(last.slice(0, 4));
        state.month = Number(last.slice(5, 7));
      }
      state.selectedDate = '';
      showView('list');
    }

    /* ---------- 지도 ---------- */
    var SVGNS = 'http://www.w3.org/2000/svg';
    var BASES = { kr: { x: 0, y: 0, w: 360, h: 440, max: 10 }, world: { x: 0, y: 0, w: 800, h: 370, max: 30 } };
    var map = { kind: 'kr', vb: null, built: false, els: {}, ptrs: {}, drag: null, pinch: null };
    var layers = {};

    function svgEl(tag, attrs) {
      var e = document.createElementNS(SVGNS, tag);
      Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      return e;
    }

    function buildMap() {
      if (map.built) return;
      map.built = true;
      var svg = $('mapSvg');
      layers.wc = svgEl('g', { 'class': 'wc' });
      layers.wu = svgEl('g', { 'class': 'wu' });
      layers.kr = svgEl('g', { 'class': 'kr' });
      layers.dots = svgEl('g', {});
      layers.labels = svgEl('g', {});
      WORLD_C.forEach(function (c) {
        var p = svgEl('path', { d: c[3], 'data-k': 'wc:' + c[0] });
        layers.wc.appendChild(p);
        map.els['wc:' + c[0]] = p;
      });
      WORLD_U.forEach(function (u, i) {
        var p = svgEl('path', { d: u[2], 'data-k': 'wu:' + i });
        layers.wu.appendChild(p);
        map.els['wu:' + i] = p;
      });
      KR_UNITS.forEach(function (u) {
        var p = svgEl('path', { d: u[4], 'data-k': 'u:' + u[0] });
        layers.kr.appendChild(p);
        map.els['u:' + u[0]] = p;
      });
      [layers.wc, layers.wu, layers.kr, layers.dots, layers.labels].forEach(function (g) { svg.appendChild(g); });
      bindMapGestures(svg);
    }

    function pxScale() {
      var r = $('mapSvg').getBoundingClientRect();
      return map.vb.w / Math.max(1, r.width);
    }

    function applyVb() {
      var v = map.vb;
      $('mapSvg').setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
      var k = pxScale();
      var i, n;
      n = layers.labels.childNodes;
      var zoomed = v.w <= BASES[map.kind].w / 1.8;
      for (i = 0; i < n.length; i++) {
        n[i].setAttribute('font-size', 11 * k);
        n[i].setAttribute('stroke-width', 3 * k);
        n[i].style.display = zoomed ? 'inline' : 'none';
      }
      n = layers.dots.childNodes;
      for (i = 0; i < n.length; i++) n[i].setAttribute('r', 4.5 * k);
    }

    function clampVb() {
      var b = BASES[map.kind];
      var v = map.vb;
      v.w = Math.min(b.w, Math.max(b.w / b.max, v.w));
      v.h = v.w * b.h / b.w;
      v.x = Math.min(b.x + b.w - v.w, Math.max(b.x, v.x));
      v.y = Math.min(b.y + b.h - v.h, Math.max(b.y, v.y));
    }

    function clientToSvg(cx, cy) {
      var r = $('mapSvg').getBoundingClientRect();
      var v = map.vb;
      return { x: v.x + (cx - r.left) / r.width * v.w, y: v.y + (cy - r.top) / r.height * v.h };
    }

    function zoomAt(factor, sx, sy) {
      var v = map.vb;
      var nw = v.w / factor;
      var b = BASES[map.kind];
      nw = Math.min(b.w, Math.max(b.w / b.max, nw));
      var ratio = nw / v.w;
      v.x = sx - (sx - v.x) * ratio;
      v.y = sy - (sy - v.y) * ratio;
      v.w = nw;
      clampVb();
      applyVb();
    }

    function zoomCenter(factor) {
      var v = map.vb;
      zoomAt(factor, v.x + v.w / 2, v.y + v.h / 2);
    }

    function resetZoom() {
      var b = BASES[map.kind];
      map.vb = { x: b.x, y: b.y, w: b.w, h: b.h };
      applyVb();
    }

    function bindMapGestures(svg) {
      svg.addEventListener('pointerdown', function (e) {
        map.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        var ids = Object.keys(map.ptrs);
        if (ids.length === 1) {
          map.drag = { sx: e.clientX, sy: e.clientY, moved: false, t: Date.now(), target: e.target };
        } else if (ids.length === 2) {
          var a = map.ptrs[ids[0]], c = map.ptrs[ids[1]];
          map.pinch = { d: Math.hypot(a.x - c.x, a.y - c.y) };
          if (map.drag) map.drag.moved = true;
        }
      });
      svg.addEventListener('pointermove', function (e) {
        var p = map.ptrs[e.pointerId];
        if (!p) return;
        var ids = Object.keys(map.ptrs);
        if (ids.length >= 2 && map.pinch) {
          var a = map.ptrs[ids[0]], c = map.ptrs[ids[1]];
          if (e.pointerId == ids[0]) { a = { x: e.clientX, y: e.clientY }; }
          else { c = { x: e.clientX, y: e.clientY }; }
          var d = Math.hypot(a.x - c.x, a.y - c.y);
          if (map.pinch.d > 0 && d > 0) {
            var mid = clientToSvg((a.x + c.x) / 2, (a.y + c.y) / 2);
            zoomAt(d / map.pinch.d, mid.x, mid.y);
          }
          map.pinch.d = d;
          p.x = e.clientX; p.y = e.clientY;
          return;
        }
        if (!map.drag) return;
        var dx = e.clientX - p.x;
        var dy = e.clientY - p.y;
        if (!map.drag.moved && Math.hypot(e.clientX - map.drag.sx, e.clientY - map.drag.sy) > 6) map.drag.moved = true;
        if (map.drag.moved) {
          var k = pxScale();
          map.vb.x -= dx * k;
          map.vb.y -= dy * k;
          clampVb();
          applyVb();
        }
        p.x = e.clientX; p.y = e.clientY;
      });
      function end(e) {
        var had = map.ptrs[e.pointerId];
        delete map.ptrs[e.pointerId];
        var left = Object.keys(map.ptrs).length;
        if (left < 2) map.pinch = null;
        if (!had) return;
        if (e.type === 'pointerup' && map.drag && !map.drag.moved && left === 0) {
          onMapTap(e.target.getAttribute ? e.target.getAttribute('data-k') : '', e);
        }
        if (left === 0) map.drag = null;
        else if (left === 1 && map.drag) {
          var id = Object.keys(map.ptrs)[0];
          map.drag.sx = map.ptrs[id].x; map.drag.sy = map.ptrs[id].y; map.drag.moved = true;
        }
      }
      svg.addEventListener('pointerup', end);
      svg.addEventListener('pointercancel', end);
      svg.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') end(e); });
      svg.addEventListener('wheel', function (e) {
        e.preventDefault();
        var s = clientToSvg(e.clientX, e.clientY);
        zoomAt(e.deltaY < 0 ? 1.25 : 0.8, s.x, s.y);
      }, { passive: false });
      svg.addEventListener('dblclick', function (e) {
        var s = clientToSvg(e.clientX, e.clientY);
        zoomAt(2, s.x, s.y);
      });
    }

    function setMapView(kind) {
      if (!mapReady) {
        ensureMapData().then(function () { setMapView(kind); }).catch(function (e) {
          $('sumEmpty').textContent = errorText(e);
          $('sumEmpty').style.display = 'block';
        });
        return;
      }
      buildMap();
      map.kind = kind;
      var kr = kind === 'kr';
      $('mapSvg').style.aspectRatio = BASES[kind].w + ' / ' + BASES[kind].h;
      layers.kr.style.display = kr ? 'inline' : 'none';
      layers.wc.style.display = kr ? 'none' : 'inline';
      layers.wu.style.display = kr ? 'none' : 'inline';
      $('segKr').className = kr ? 'on' : '';
      $('segWorld').className = kr ? '' : 'on';
      $('mapCap').textContent = '';
      $('chips').style.display = 'none';
      state.sel = '';
      resetZoom();
      paintMap();
    }

    // 지역 목록을 지도 위치로 바꿔서 칠하기
    function paintMap() {
      var regions = (state.summary && state.summary.regions) || [];
      var krRegs = {};      // 한국 단위 id -> 지역들
      var wuRegs = {};      // 'wu:i' / 'wp:i' -> 지역들
      var cAll = {};        // ISO3 -> 나라 전체 지역들
      var cAny = {};        // ISO3 -> 이 나라에서 다녀온 모든 지역
      var unmatched = [];
      regions.forEach(function (r) {
        var loc = locate(r.name);
        if (loc.kr.length) {
          loc.kr.forEach(function (id) { (krRegs[id] = krRegs[id] || []).push(r); });
          (cAny.KOR = cAny.KOR || []).push(r);
        } else if (loc.country === 'KOR') {
          (cAny.KOR = cAny.KOR || []).push(r);
        } else if (loc.world.length) {
          loc.world.forEach(function (w) { var k = w.t + ':' + w.i; (wuRegs[k] = wuRegs[k] || []).push(r); });
          (cAny[loc.country] = cAny[loc.country] || []).push(r);
        } else if (loc.whole) {
          (cAll[loc.country] = cAll[loc.country] || []).push(r);
          (cAny[loc.country] = cAny[loc.country] || []).push(r);
        } else {
          unmatched.push(r);
        }
      });
      state.krRegs = krRegs; state.wuRegs = wuRegs; state.cAll = cAll; state.cAny = cAny; state.unmatched = unmatched;
      if (!map.built) return;

      var lit = {};
      Object.keys(krRegs).forEach(function (id) { lit['u:' + id] = true; });
      Object.keys(wuRegs).forEach(function (k) { if (k.indexOf('wu:') === 0) lit[k] = true; });
      WORLD_U.forEach(function (u, i) { if (cAll[u[0]]) lit['wu:' + i] = true; });
      Object.keys(cAll).forEach(function (a3) { lit['wc:' + a3] = true; });
      if (cAny.KOR) lit['wc:KOR'] = true;
      Object.keys(map.els).forEach(function (k) {
        var p = map.els[k];
        p.setAttribute('class', lit[k] ? 'lit' : '');
        if (lit[k]) p.parentNode.appendChild(p);
      });

      layers.dots.innerHTML = '';
      layers.labels.innerHTML = '';
      Object.keys(wuRegs).forEach(function (k) {
        if (k.indexOf('wp:') !== 0) return;
        var pt = WORLD_P[Number(k.slice(3))];
        var c = svgEl('circle', { cx: pt[2], cy: pt[3], r: 3, 'class': 'dot', 'data-k': k });
        layers.dots.appendChild(c);
      });
      if (cAny.KOR) {
        layers.dots.appendChild(svgEl('circle', { cx: KR_WORLD_XY[0], cy: KR_WORLD_XY[1], r: 3, 'class': 'dot', 'data-k': 'wc:KOR' }));
      }
      Object.keys(krRegs).forEach(function (id) {
        var u = KR_UNITS.filter(function (x) { return x[0] === id; })[0];
        if (!u) return;
        var t = svgEl('text', { x: u[5], y: u[6], 'font-size': 11 });
        t.textContent = u[1];
        layers.labels.appendChild(t);
      });
      applyVb();
      if (unmatched.length) showChips('지도에 찍지 못한 곳', unmatched);
    }

    function setSel(key) {
      Object.keys(map.els).forEach(function (k) {
        var p = map.els[k];
        var c = (p.getAttribute('class') || '').replace(/\s*sel/g, '');
        p.setAttribute('class', k === key ? c + ' sel' : c);
      });
      if (key && map.els[key]) map.els[key].parentNode.appendChild(map.els[key]);
    }

    function showChips(title, list) {
      var box = $('chips');
      box.innerHTML = '';
      box.style.display = 'block';
      box.appendChild(el('div', 'chipTitle', title));
      var row = el('div', 'chipRow');
      list.forEach(function (r) {
        var b = el('button', 'chipBtn', r.name + ' · ' + r.count + '장');
        b.type = 'button';
        b.addEventListener('click', function () { openRegion(r.name, r.last); });
        row.appendChild(b);
      });
      box.appendChild(row);
    }

    function onMapTap(key) {
      if (!key) return;
      var title = '';
      var list = null;
      if (key.indexOf('u:') === 0) {
        var id = key.slice(2);
        title = UNIT[id].name;
        list = state.krRegs && state.krRegs[id];
        if (!list) { $('mapCap').textContent = title + ' · 아직 가지 않았어요'; setSel(''); return; }
      } else if (key.indexOf('wu:') === 0 || key.indexOf('wp:') === 0) {
        var arr = key.indexOf('wu:') === 0 ? WORLD_U : WORLD_P;
        var u = arr[Number(key.slice(3))];
        title = u[1];
        list = (state.wuRegs && state.wuRegs[key]) || (state.cAll && state.cAll[u[0]]);
        if (!list) { $('mapCap').textContent = title; setSel(''); return; }
      } else if (key.indexOf('wc:') === 0) {
        var a3 = key.slice(3);
        if (a3 === 'KOR' && state.cAny && state.cAny.KOR) { setMapView('kr'); return; }
        title = (WC_BY_A3[a3] && WC_BY_A3[a3][2]) || '';
        list = state.cAll && state.cAll[a3];
        if (!list) { $('mapCap').textContent = title; setSel(''); return; }
      }
      state.sel = key;
      setSel(key);
      $('mapCap').textContent = title;
      showChips(title + ' 사진 보기', list);
    }

    function loadSummary() {
      state.summary = null;
      Promise.all([call('getSummary', [state.token, state.who]), ensureMapData()])
        .then(function (rs) {
          var s = rs[0];
          state.summary = s;
          $('chips').style.display = 'none';
          $('stat1').textContent = String(s.regions.length);
          $('stat2').textContent = String(s.days);
          $('stat3').textContent = String(s.photos);
          $('sumEmpty').style.display = s.photos ? 'none' : 'block';
          setMapView('kr');
        })
        .catch(function (e) {
          handleFail(e, function (t) { $('sumEmpty').textContent = '불러오지 못했어요. ' + t; $('sumEmpty').style.display = 'block'; });
        });
    }

    /* ---------- 이벤트 연결 ---------- */
    $('authForm').addEventListener('submit', function (e) { e.preventDefault(); submitAuth(); });
    $('toggleMode').addEventListener('click', function () { setMode(!signupMode); });
    $('avatar').addEventListener('click', function (e) {
      e.stopPropagation();
      $('menu').style.display = $('menu').style.display === 'block' ? 'none' : 'block';
    });
    document.addEventListener('click', function () { $('menu').style.display = 'none'; });
    $('logout').addEventListener('click', function () {
      var t = state.token;
      call('logout', [t]).catch(function () {});
      dbClear();
      toLogin('');
    });

    $('tab_input').addEventListener('click', function () { showView('input'); });
    $('tab_list').addEventListener('click', function () { showView('list'); });
    $('tab_summary').addEventListener('click', function () { showView('summary'); });
    $('tab_friends').addEventListener('click', function () { showView('friends'); });
    $('friendAdd').addEventListener('click', addFriend);
    $('friendId').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addFriend(); } });

    $('shoot').addEventListener('click', openOuter);
    $('shootInner').addEventListener('click', openInner);
    $('stage').addEventListener('click', openOuter);
    $('stage').addEventListener('keydown', onKey(openOuter));
    $('inset').addEventListener('click', function (e) { e.stopPropagation(); openInner(); });
    $('inset').addEventListener('keydown', onKey(openInner));

    $('photo').addEventListener('change', function () {
      var file = this.files[0];
      if (outerUrl) { URL.revokeObjectURL(outerUrl); outerUrl = null; }
      if (!file) { clearOuter(); return; }
      outerUrl = URL.createObjectURL(file);
      $('preview').src = outerUrl;
      $('preview').style.display = 'block';
      $('stageEmpty').style.display = 'none';
      $('shoot').textContent = '바깥 다시 찍기';
      $('shoot').className = 'btn done';
    });

    $('photoInner').addEventListener('change', function () {
      var file = this.files[0];
      if (innerUrl) { URL.revokeObjectURL(innerUrl); innerUrl = null; }
      if (!file) { clearInner(); return; }
      innerUrl = URL.createObjectURL(file);
      $('innerPreview').src = innerUrl;
      $('innerPreview').style.display = 'block';
      $('insetEmpty').style.display = 'none';
      $('inset').className = 'inset filled';
      $('shootInner').textContent = '안쪽 다시 찍기';
      $('shootInner').className = 'btn done';
    });

    $('region').addEventListener('input', updateBadge);
    $('memo').addEventListener('input', function () { $('cnt').textContent = this.value.length; });
    $('save').addEventListener('click', saveEntryClick);

    $('prevM').addEventListener('click', function () { moveMonth(-1); });
    $('nextM').addEventListener('click', function () { moveMonth(1); });
    $('filter').addEventListener('change', function () {
      state.filter = this.value;
      var r = findRegion(this.value);
      if (r && r.last) {
        state.year = Number(r.last.slice(0, 4));
        state.month = Number(r.last.slice(5, 7));
      }
      state.selectedDate = '';
      loadMonth();
    });

    $('segKr').addEventListener('click', function () { setMapView('kr'); });
    $('segWorld').addEventListener('click', function () { setMapView('world'); });
    $('zIn').addEventListener('click', function () { zoomCenter(1.7); });
    $('zOut').addEventListener('click', function () { zoomCenter(1 / 1.7); });
    $('zReset').addEventListener('click', resetZoom);

    /* ---------- 시작 ---------- */
    $('tip').textContent = REQUIRE_INNER
      ? '큰 사진은 바깥 카메라, 작은 사진은 안쪽 카메라로 찍어요.'
      : '큰 사진은 바깥 카메라로 찍어요. 안쪽 사진은 있으면 함께 담겨요.';
    setMode(false);

    (function start() {
      var token = loadToken();
      if (!token) { warmServer(); toLogin(''); return; }
      var savedId = loadId();
      if (savedId) {
        // 로그인이 풀렸는지는 따로 묻지 않는다. 첫 요청이 알려 주고, 그러면 로그인 화면으로 돌아간다.
        enterApp({ token: token, id: savedId });
        return;
      }
      call('checkSession', [token])
        .then(function (id) {
          if (id) enterApp({ token: token, id: id });
          else toLogin('');
        })
        .catch(function () { toLogin(''); });
    })();
  </script>
</body>
</html>
